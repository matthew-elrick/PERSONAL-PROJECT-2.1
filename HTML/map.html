    <style>
        body {
            margin: 0;
            padding: 0;
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #results {
            position: absolute;
            top: 20%;
            left: 1%;
            width: 30%;
            overflow: auto;
            background: rgba(255, 255, 255, 0.8);
            z-index: 7;
        }

            #results ul {
                list-style-type: none;
                padding: 0;
                margin: 0;
            }

                #results ul li {
                    padding: 10px;
                    cursor: pointer;
                    border-bottom: 1px solid gray;
                }

                    #results ul li:hover {
                        color: gray;
                    }

                    #results ul li:last-child {
                        border-bottom-width: 0;
                    }

        .coordinates {
            position: absolute;
            top: 8%;
            left: 1%;
            z-index: 10;
            width: fit-content;
        }

        /*Marker stuff for pictures*/
        ul {
            list-style-type: none;
            padding: 0;
            margin: 5px;
        }

        .marker {
            position: absolute;
            pointer-events: none;
            color: #000;
            line-height: 12px;
            box-shadow: #00000040 0px 2px 10px;
        }

        .marker-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .markerPointy {
            width: 12px;
            height: 12px;
            background-color: #e6e6e6;
            position: absolute;
            transform: rotate(45deg) translate(-70%);
            bottom: -12px;
            left: 0;
            right: -12px;
            margin: auto;
            box-shadow: #00000040 0px 2px 10px;
        }

        .markerBody {
            position: absolute;
            background: #e6e6e6;
            width: 100%;
            height: 100%;
            top: 0;
            border-radius: 2px;
        }

        .markerTop {
            border-top-left-radius: inherit;
            border-top-right-radius: inherit;
            width: 100%;
            height: 20px;
            line-height: 20px;
            text-align: center;
            background: #593895;
            color: white;
            font-size: 15px;
            font-weight: 400;
        }

        .markerBottom {
            border-radius: inherit;
            width: 100%;
            height: calc(100% - 20px);
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .fade-in-animation {
            animation: fadeIn 0.3s ease forwards;
        }
    </style>
</head>

<body>
    <div id="map"></div>

    <div class="coordinates">
        <div class="mb-1">
            <input type="text" class="form-control" id="lat" placeholder="Latitude" aria-label="Latitude">
        </div>
        <div class="mb-1">
            <input type="text" class="form-control" id="lng" placeholder="Longitude" aria-label="Longitude">
        </div>

            <button type="button" id="btn-search-reverse" class="btn btn-primary">Search</button>

    </div>

        const appContainer = document.getElementById('map');

        const pendingPhotos = [];
        const photoMarkers = [];
        let mapReady = false;

        const map = new maplibregl.Map({
            container: 'map', // id
            style: `https://api.maptiler.com/maps/01a00c75-0337-7dca-b28b-aeca012f3b6c/style.json?key=${key}`, // style of map
            center: [-76, 45],
            zoom: 8
        });

        const photoFeatures = [];

        map.on('load', () => {
            //search bar
            const gc = new maptilerGeocoder.GeocodingControl({ apiKey: key });
            map.addControl(gc, 'top-left')

            //reverse clicking to location
            map.addSource('search-results', {
                type: 'geojson',
                data: {
                    "type": "FeatureCollection",
                    "features": []
                }
            });

            //circles for reverse geocoding
            //these and the side box use the features that get brought up, so i just need to remove this section if i dont want the circles.
            map.addLayer({
                'id': 'point-result',
                'type': 'circle',
                'source': 'search-results',
                'paint': {
                    'circle-radius': 8,
                    'circle-color': '#B42222',
                    'circle-opacity': 0.5
                },
                'filter': ['==', '$type', 'Point']
            });

            //coordinate geolocate
            const center = map.getCenter();
            document.getElementById('lat').value = center.lat;
            document.getElementById('lng').value = center.lng;

            mapReady = true;
            pendingPhotos.forEach(photo => addPhotoMarker(photo));
            pendingPhotos.length = 0;
        });

        //function for reverse geocoding
        map.on('click', async (e) => {

            const lng = e.lngLat.lng;
            const lat = e.lngLat.lat;

            document.getElementById('lat').value = lat;
            document.getElementById('lng').value = lng;

            try {
                const response = await fetch(`https://api.maptiler.com/geocoding/${lng},${lat}.json?key=${key}`);

                const results = await response.json();
                map.getSource('search-results').setData(results);

                //SIDE BOX RESULTS FOR COORDINATES (names of places n stuff)
                if (results.features && results.features.length > 0) {
                    const resultList = results.features.map((feature) => {
                        if (!feature.bbox) {
                            return `<li>${feature.place_name}</li>`;
                        }
                        return `<li onclick="map.fitBounds([${feature.bbox}], { maxZoom: 19 })">${feature.place_name}</li>`;
                    });

                    document.getElementById('search-results').innerHTML = resultList.join('');
                } else {
                    document.getElementById('search-results').innerHTML = '<li>Couldnt fund results</li>';
                }

                reverseGeocoding(lng, lat);

            } catch (error) {
                console.error("Error with the stupid coordinate thing:", error);
            }
        });

        let marker;

        //moving to marker more
        async function reverseGeocoding(lng, lat) {
            if (
                Number.isNaN(lng) ||
                Number.isNaN(lat) ||
                lng < -180 ||
                lng > 180 ||
                lat < -90 ||
                lat > 90
            ) {
                return;
            }

            try {
                const response = await fetch(`https://api.maptiler.com/geocoding/${lng},${lat}.json?key=${key}`);

                const result = await response.json();

                if (marker) {
                    marker.setLngLat([lng, lat]);
                } else {
                    marker = new maplibregl.Marker().setLngLat([lng, lat]).addTo(map);
                }
                map.flyTo({ center: [lng, lat], essential: true });

            } catch (error) {
                console.error("It didnt work", error);
            }
        }

    function addPhotoMarker(photo) {
        if (!mapReady) {
            pendingPhotos.push(photo);
            return;
        }

        console.log("===== PHOTO =====");
        console.log("Filename:", photo.filename);
        console.log("Latitude:", photo.latitude);
        console.log("Longitude:", photo.longitude);
        console.log("=========================");

        const coordinates = [
            photo.longitude,
            photo.latitude
        ];

        map.jumpTo({
            center: coordinates,
            zoom: 15
        });

        const markerElement = document.createElement("div");

        markerElement.style.width = "140px";
        markerElement.style.height = "80px";
        markerElement.style.backgroundColor = "#e6e6e6";
        markerElement.style.borderRadius = "6px";
        markerElement.style.overflow = "hidden";
        markerElement.style.zIndex = "999999";
        markerElement.style.position = "absolute";

        const image = document.createElement("img");

        image.src =
            `https://photos.example/${encodeURIComponent(photo.filename)}`;

        image.style.width = "100%";
        image.style.height = "100%";
        image.style.objectFit = "cover";
        image.style.display = "block";

        image.onload = () => {
            console.log("PHOTO LOADED:", image.src);
        };

        image.onerror = () => {
            console.error("PHOTO FAILED TO LOAD:", image.src);
        };

        markerElement.appendChild(image);

        const point = map.project(coordinates);

        markerElement.style.left = `${point.x - 70}px`;
        markerElement.style.top = `${point.y - 80}px`;

        map.getContainer().appendChild(markerElement);

        console.log("MANUAL MARKER POSITION:", point);
        console.log("MARKER ELEMENT:", markerElement);
        console.log("MARKER IN DOM:", document.body.contains(markerElement));
        console.log("MARKER RECT:", markerElement.getBoundingClientRect());
    }
